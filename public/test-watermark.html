<!DOCTYPE html>
<html>
<head><title>WM Test</title></head>
<body style="background:#111;color:#fff;font-family:monospace;padding:20px">
<h3>Video Watermark Test</h3>
<div id="log"></div>
<div id="results" style="display:flex;gap:20px;flex-wrap:wrap;margin-top:20px"></div>
<script type="module">
  import { removeWatermarkFromImage, createWatermarkEngine } from '/node_modules/@pilio/gemini-watermark-remover/dist/browser.esm.js'
  import { detectWatermarkConfig, calculateWatermarkPosition } from '/node_modules/@pilio/gemini-watermark-remover/dist/browser.esm.js'

  const log = document.getElementById('log')
  const results = document.getElementById('results')
  function p(msg) { log.textContent += msg + '\n'; console.log(msg) }

  // Fetch the video
  p('Loading video...')
  const resp = await fetch('/mp4.mp4')
  if (!resp.ok) { p('FAILED to fetch video: ' + resp.status); throw new Error('fetch failed') }
  const blob = await resp.blob()
  p('Video blob size: ' + blob.size)

  const url = URL.createObjectURL(blob)
  const video = document.createElement('video')
  video.src = url
  video.muted = true
  video.preload = 'auto'
  await new Promise(r => { video.onloadeddata = r })
  p('Video loaded: ' + video.videoWidth + 'x' + video.videoHeight)

  // Extract frame 0
  video.currentTime = 0.5
  await new Promise(r => { video.onseeked = r })
  p('Seeked to 0.5s')

  const w = video.videoWidth, h = video.videoHeight

  // Create canvas for original frame
  const origCanvas = document.createElement('canvas')
  origCanvas.width = w; origCanvas.height = h
  const origCtx = origCanvas.getContext('2d')
  origCtx.drawImage(video, 0, 0, w, h)

  // Show original
  const origImg = document.createElement('img')
  origImg.src = origCanvas.toDataURL()
  origImg.style.cssText = 'max-width:400px;border:2px solid red'
  const origLabel = document.createElement('div')
  origLabel.textContent = 'ORIGINAL'
  origLabel.style.cssText = 'color:red;font-weight:bold'
  const origWrap = document.createElement('div')
  origWrap.appendChild(origLabel)
  origWrap.appendChild(origImg)
  results.appendChild(origWrap)

  // Check what the library detects
  p('Detecting watermark...')
  const config = detectWatermarkConfig(w, h)
  p('Config: ' + JSON.stringify(config))
  const pos = calculateWatermarkPosition(w, h, config)
  p('Position: ' + JSON.stringify(pos))

  // Create engine and get alpha map
  p('Creating engine...')
  const engine = await createWatermarkEngine()
  p('Engine created')

  // Run full removal
  p('Running removeWatermarkFromImage...')
  const start = performance.now()
  const result = await removeWatermarkFromImage(video, { adaptiveMode: 'auto' })
  const elapsed = (performance.now() - start).toFixed(0)
  p('Done in ' + elapsed + 'ms')

  // Show result
  const resultCanvas = result.canvas
  const resultImg = document.createElement('img')
  resultImg.src = resultCanvas.toDataURL()
  resultImg.style.cssText = 'max-width:400px;border:2px solid green'
  const resultLabel = document.createElement('div')
  resultLabel.textContent = 'RESULT (meta: ' + JSON.stringify(result.meta) + ')'
  resultLabel.style.cssText = 'color:green;font-weight:bold'
  const resultWrap = document.createElement('div')
  resultWrap.appendChild(resultLabel)
  resultWrap.appendChild(resultImg)
  results.appendChild(resultWrap)

  // Pixel diff
  const origData = origCtx.getImageData(0, 0, w, h).data
  const resultCtx = resultCanvas.getContext('2d')
  const resData = resultCtx.getImageData(0, 0, resultCanvas.width, resultCanvas.height).data
  let changed = 0
  const minLen = Math.min(origData.length, resData.length)
  for (let i = 0; i < minLen; i += 4) {
    if (origData[i] !== resData[i] || origData[i+1] !== resData[i+1] || origData[i+2] !== resData[i+2]) changed++
  }
  p('Pixels changed: ' + changed + ' / ' + (w*h) + ' (' + (changed*100/(w*h)).toFixed(2) + '%)')

  // Zoomed comparison of bottom-right corner (where watermark usually is)
  const cropSize = 200
  const cropX = Math.max(0, w - cropSize)
  const cropY = Math.max(0, h - cropSize)

  const cropOrig = document.createElement('canvas')
  cropOrig.width = cropSize; cropOrig.height = cropSize
  cropOrig.getContext('2d').drawImage(origCanvas, cropX, cropY, cropSize, cropSize, 0, 0, cropSize, cropSize)

  const cropResult = document.createElement('canvas')
  cropResult.width = cropSize; cropResult.height = cropSize
  cropResult.getContext('2d').drawImage(resultCanvas, cropX, cropY, cropSize, cropSize, 0, 0, cropSize, cropSize)

  const cropLabel = document.createElement('div')
  cropLabel.textContent = 'BOTTOM-RIGHT ZOOM (watermark area)'
  cropLabel.style.cssText = 'color:yellow;font-weight:bold;margin-top:20px'
  results.appendChild(cropLabel)

  const zoomWrap = document.createElement('div')
  zoomWrap.style.cssText = 'display:flex;gap:10px'
  
  const co = document.createElement('img')
  co.src = cropOrig.toDataURL()
  co.style.cssText = 'width:300px;border:2px solid red'
  const cr = document.createElement('img')
  cr.src = cropResult.toDataURL()
  cr.style.cssText = 'width:300px;border:2px solid green'
  zoomWrap.appendChild(co)
  zoomWrap.appendChild(cr)
  results.appendChild(zoomWrap)

  p('DONE')
</script>
</body>
</html>
